# Manual release workflow: Actions tab -> build-release -> Run workflow
# Pipeline: build dist -> commit dist to the repo -> tag vX.Y.Z -> create Release
# Version always comes from source (package.json <-> src/OmniDebugLink.ts
# LIB_VERSION, cross-checked at build time); re-running the same version fails
# at the tag check — bump first.
# dist is committed to the repo on purpose: npm installs from GitHub run no
# build scripts, so `npm install omnidebuglink/omnidebuglink_react_native#vX.Y.Z`
# relies on the in-repo dist.
name: build-release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Extra release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build dist
        run: npm run build

      - name: Commit dist
        run: |
          git config user.name  "odl-release-bot"
          git config user.email "noreply@omnidebuglink.dev"
          git add dist
          if git diff --cached --quiet; then
            echo "dist unchanged, skipping commit"
          else
            git commit -m "build: dist v$(node -p "require('./package.json').version")"
          fi

      - name: Check tag is free
        run: |
          git fetch --tags origin
          TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists — bump package.json + LIB_VERSION first"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Push commit + tag
        run: |
          git tag "$TAG"
          git push origin HEAD
          git push origin "$TAG"

      - name: Render release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "## Install (RN >= 0.70, iOS 13+, Android minSdk 21)"
            echo
            echo '```bash'
            echo "npm install omnidebuglink/omnidebuglink_react_native#$TAG"
            echo 'cd ios && pod install   # Android is autolinked, no manual registration'
            echo '```'
            echo
            echo '```ts'
            echo "import { OmniDebugLink } from '@omnidebuglink/react-native';"
            echo
            echo "const client = new OmniDebugLink();"
            echo "client.start('wss://api.omnidebuglink.dev/ws?token=<clientToken>');"
            echo '```'
            echo
            echo "## Notes"
            echo
            echo "- Pure-TS protocol layer + Kotlin/Swift native bridge (autolinking wires everything)"
            echo "- 18 built-in tasks + a dev-build-only \`reload\` (see README for the full list)"
            echo "- Expo: bare/prebuild works; managed + dev-client works; Expo Go does not"
            if [ -n "$NOTES" ]; then
              echo
              echo "$NOTES"
            fi
          } > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --latest --notes-file release-notes.md
