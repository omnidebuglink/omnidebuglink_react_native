# 手动发版工作流：Actions 页面 → build-release → Run workflow
# 流程：构建 dist → 提交 dist 到仓库 → 打 tag vX.Y.Z → 发 Release
# 版本号一律来自源码(package.json ↔ src/OmniDebugLink.ts LIB_VERSION，构建时校验一致)；
# 同版本重复跑会在"检查 tag"一步报错 —— 先 bump 再跑。
# dist 提交进仓库是刻意的：npm 从 GitHub 安装不执行构建脚本，
# 用户 npm install omnidebuglink/omnidebuglink_react_native#vX.Y.Z 依赖仓库内的 dist。
name: build-release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: '附加 Release 说明(可选)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build dist
        run: npm run build

      - name: Commit dist
        run: |
          git config user.name  "odl-release-bot"
          git config user.email "noreply@omnidebuglink.dev"
          git add dist
          if git diff --cached --quiet; then
            echo "dist 无变化,跳过提交"
          else
            git commit -m "build: dist v$(node -p "require('./package.json').version")"
          fi

      - name: 检查 tag 未被占用
        run: |
          git fetch --tags origin
          TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 已存在,先 bump package.json + LIB_VERSION 再跑"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Push commit + tag
        run: |
          git tag "$TAG"
          git push origin HEAD
          git push origin "$TAG"

      - name: 生成 Release 说明
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "## 接入(RN ≥ 0.70,iOS 13+,Android minSdk 21)"
            echo
            echo '```bash'
            echo "npm install omnidebuglink/omnidebuglink_react_native#$TAG"
            echo 'cd ios && pod install   # Android 走 autolinking,无需手动注册'
            echo '```'
            echo
            echo '```ts'
            echo "import { OmniDebugLink } from '@omnidebuglink/react-native';"
            echo
            echo "const client = new OmniDebugLink();"
            echo "client.start('wss://api.omnidebuglink.dev/ws?token=<clientToken>');"
            echo '```'
            echo
            echo "## 说明"
            echo
            echo "- 纯 JS 协议层 + Kotlin/Swift 原生桥(autolinking 自动接线)"
            echo "- 18 个内置 task + dev 构建额外 reload(见 README 能力表)"
            echo "- Expo:bare/prebuild 可用;managed + dev-client 可用;Expo Go 不可用"
            if [ -n "$NOTES" ]; then
              echo
              echo "$NOTES"
            fi
          } > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --latest --notes-file release-notes.md
