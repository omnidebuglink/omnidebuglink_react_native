def omlExt(name, fallback) {
  rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  namespace 'com.omnidebuglink.rn'
  compileSdk omlExt('compileSdkVersion', 34)

  defaultConfig {
    minSdk omlExt('minSdkVersion', 21)
  }

  lintOptions {
    abortOnError false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  google()
  mavenCentral()
  maven { url "$rootDir/../node_modules/react-native/android" }
}

dependencies {
  implementation "com.facebook.react:react-native:${omlExt('reactNativeVersion', '+')}"
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${omlExt('kotlinVersion', '1.9.22')}"
}
